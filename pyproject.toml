[project]
name = "inf8239-tf-dss-tickets"
version = "0.1.0"
description = "Clasificación de tickets de soporte para apoyar su enrutamiento (trabajo final INF-8239, Modalidad A)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "ipykernel>=6.29,<8", "nbconvert>=7.16,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickets_dss"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
